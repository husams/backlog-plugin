name: Sync pull requests to Backlog

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: backlog-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: backlog-plugin-runner
    env:
      BACKLOG_DB: postgres
      BACK_LOG_URL: ${{ secrets.BACK_LOG_URL }}
      BACKLOG_PROJECT: backlog-plugin

    steps:
      - name: Check out the trusted base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify local runner requirements
        shell: bash
        run: |
          set -euo pipefail
          command -v uv >/dev/null
          command -v jq >/dev/null
          test -n "$BACK_LOG_URL"

      - name: Apply GitHub event
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_FILE: ${{ github.event_path }}
          ACTOR: github:${{ github.actor }}
        run: |
          set -euo pipefail

          BL="$GITHUB_WORKSPACE/skills/backlog/bin/backlog"

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            pr_count="$(jq '.workflow_run.pull_requests | length' "$EVENT_FILE")"
            if [[ "$pr_count" == "0" ]]; then
              echo "The workflow run is not associated with a pull request."
              exit 0
            fi
            branch="$(jq -r '.workflow_run.head_branch' "$EVENT_FILE")"
            pr_number="$(jq -r '.workflow_run.pull_requests[0].number' "$EVENT_FILE")"
            pr_url="https://github.com/$GITHUB_REPOSITORY/pull/$pr_number"
            conclusion="$(jq -r '.workflow_run.conclusion' "$EVENT_FILE")"
          else
            branch="$(jq -r '.pull_request.head.ref' "$EVENT_FILE")"
            pr_url="$(jq -r '.pull_request.html_url' "$EVENT_FILE")"
          fi

          if [[ "$branch" =~ (^|/)([FfSsTt]-[0-9]+)(-|/|$) ]]; then
            task_key="$(printf '%s' "${BASH_REMATCH[2]}" | tr '[:lower:]' '[:upper:]')"
          else
            echo "No backlog key found in branch '$branch'."
            echo "Use a branch such as S-004-short-description."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            case "$conclusion" in
              failure) action="check.failed" ;;
              timed_out) action="check.timed_out" ;;
              cancelled) action="check.cancelled" ;;
              success) action="check.passed" ;;
              *) exit 0 ;;
            esac
            "$BL" action "$task_key" "$action" \
              --actor "$ACTOR" \
              --operation "github.workflow_run" \
              --parameter "conclusion=$conclusion" \
              --parameter "pull_request_url=$pr_url"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request_review" ]]; then
            review_state="$(jq -r '.review.state' "$EVENT_FILE")"
            case "$EVENT_ACTION:$review_state" in
              submitted:approved)
                "$BL" pr set "$task_key" --url "$pr_url" --review-state approved \
                  --actor "$ACTOR"
                ;;
              submitted:changes_requested)
                "$BL" pr set "$task_key" --url "$pr_url" \
                  --review-state changes_requested --actor "$ACTOR"
                ;;
              dismissed:*)
                "$BL" pr set "$task_key" --url "$pr_url" --review-state pending \
                  --actor "$ACTOR"
                "$BL" action "$task_key" "review.dismissed" \
                  --actor "$ACTOR" --operation "github.pull_request_review.dismissed"
                ;;
              *) echo "Review recorded; no transition action applies." ;;
            esac
            exit 0
          fi

          case "$EVENT_ACTION" in
            opened|reopened|synchronize|ready_for_review)
              draft="$(jq -r '.pull_request.draft' "$EVENT_FILE")"
              if [[ "$draft" == "true" ]]; then
                "$BL" pr set "$task_key" --url "$pr_url" --state draft \
                  --actor "$ACTOR"
              else
                "$BL" pr set "$task_key" --url "$pr_url" --state open \
                  --actor "$ACTOR"
              fi
              ;;
            converted_to_draft)
              "$BL" pr set "$task_key" --url "$pr_url" --state draft \
                --actor "$ACTOR"
              ;;
            closed)
              merged="$(jq -r '.pull_request.merged' "$EVENT_FILE")"
              if [[ "$merged" == "true" ]]; then
                "$BL" pr set "$task_key" --url "$pr_url" --state merged \
                  --actor "$ACTOR"
              else
                "$BL" pr set "$task_key" --url "$pr_url" --state closed \
                  --actor "$ACTOR"
              fi
              ;;
          esac
