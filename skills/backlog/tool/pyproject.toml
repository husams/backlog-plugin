[project]
name = "backlog-cli"
version = "1.7.1"
description = "Backlog tracker for coding agents, including retrospective improvement actions"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# Only needed when BACKLOG_DB selects a shared PostgreSQL server. The default
# The SQLite backend runs with no third-party packages.
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
backlog = "backlog_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backlog_cli"]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-bdd>=8.1,<9",
    "pytest-cov>=7.1,<8",
]

[tool.coverage.run]
branch = true
source = ["backlog_cli"]
relative_files = true
patch = ["subprocess"]
disable_warnings = ["module-not-imported", "no-data-collected"]

[tool.coverage.report]
fail_under = 99
precision = 1
show_missing = true
skip_covered = true
