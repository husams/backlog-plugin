[project]
name = "backlog-cli"
version = "1.3.0"
description = "Backlog tracker for coding agents (features / stories / subtasks / dependencies / review threads)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only needed when BACKLOG_DB selects a shared PostgreSQL server. The default
# The SQLite backend runs with no third-party packages.
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
backlog = "backlog_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backlog_cli"]
